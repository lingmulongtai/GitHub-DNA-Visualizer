server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: route all paths through index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
